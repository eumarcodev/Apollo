name: Build (Windows)

# Reusable workflow: builds Helios on Windows (MSYS2 UCRT64) and uploads the installer and the portable zip
# as a workflow artifact. Called by pr.yml, rc.yml and promote.yml. It never publishes anything.
on:
  workflow_call:
    inputs:
      version:
        description: Version baked into the binaries and the file names, without the leading "v" (e.g. 1.3.0-rc.1)
        type: string
        required: true
      ref:
        description: Commit SHA to build (defaults to the commit that triggered the caller)
        type: string
        required: false
        default: ""
      artifact-name:
        description: Name of the uploaded artifact
        type: string
        required: false
        default: helios-windows-x64

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows, MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BRANCH: ${{ github.ref_name }}
      COMMIT: ${{ inputs.ref || github.sha }}
      # The MSYS2 login shell does not always forward this, and CMake needs it to find build-deps/dist/Windows-AMD64
      PROCESSOR_ARCHITECTURE: AMD64
    steps:
      - name: Keep line endings untouched
        shell: pwsh
        run: git config --global core.autocrlf false

      # Shallow, and without submodules: the next step fetches only the ones the Windows build uses
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Skipped (Linux packaging, docs, tests are off): flatpak deps, wayland-protocols, wlr-protocols, inputtino,
      # doxyconfig, googletest. PyroWave is not recursive: of Granite's many nested submodules only two are needed
      # (the same ones as third-party/pyrowave/checkout_granite.sh). Each one is shallow (depth 1); if a server
      # refuses a shallow fetch of the pinned commit, that one is fetched in full.
      - name: Fetch the submodules the Windows build uses
        shell: bash
        run: |
          set -euo pipefail
          fetch() {  # fetch <repo dir> <submodule path> [--recursive]
            git -C "$1" submodule update --init --depth 1 "${@:3}" "$2" ||
              git -C "$1" submodule update --init "${@:3}" "$2"
          }
          skip='^third-party/(pyrowave|doxyconfig|googletest|inputtino|wayland-protocols|wlr-protocols)$|^packaging/linux/'
          for path in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | grep -Ev "${skip}"); do
            fetch . "$path" --recursive
          done
          fetch . third-party/pyrowave
          fetch third-party/pyrowave Granite
          for module in third_party/volk third_party/khronos/vulkan-headers; do
            fetch third-party/pyrowave/Granite "$module"
          done
          git submodule status --recursive | cut -c1-60

      # The web UI (React 19, Vite 8) needs Node ^20.19 or >=22.12; pin it instead of relying on the runner image
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # path-type: inherit keeps the runner's official Node.js/npm on PATH, as required by docs/building.md
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      # HELIOS_UPDATE_REPO makes the web UI check this repository's releases for new versions
      - name: Configure
        run: cmake -B build -G Ninja -S . -DHELIOS_UPDATE_REPO=${{ github.repository }} -DHELIOS_ENABLE_PYROWAVE=ON

      - name: Build
        run: ninja -C build

      - name: Package (installer and portable zip)
        run: |
          cpack -G NSIS --config ./build/CPackConfig.cmake
          cpack -G ZIP --config ./build/CPackConfig.cmake

      - name: Rename artifacts
        run: |
          cd build/cpack_artifacts
          mv Helios.exe "Helios-${BUILD_VERSION}-windows-x64-installer.exe"
          mv Helios.zip "Helios-${BUILD_VERSION}-windows-x64-portable.zip"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            build/cpack_artifacts/Helios-*-installer.exe
            build/cpack_artifacts/Helios-*-portable.zip
          if-no-files-found: error
